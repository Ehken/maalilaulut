<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liiga maalilaulut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800;1,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e14; --panel: #141924; --panel2: #222a3a;
    --text: #f2f4f8; --muted: #8b93a7; --ice: #cfe8ff; --red: #e3242b;
    --orange: #ff8a00; --green: #7ee2a8;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(1100px 520px at 50% -10%, #1d2a44 0%, transparent 60%), var(--bg);
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: clamp(16px, 3vw, 40px) clamp(16px, 4vw, 64px) 40px; }
  .cond { font-family: var(--cond); }
  .italic { font-style: italic; font-weight: 900; text-transform: uppercase; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }
  [hidden] { display: none !important; }

  /* Yleiset napit */
  .icon-btn { width: 52px; height: 52px; flex: none; border-radius: 14px; background: var(--panel); border: 1px solid rgba(255,255,255,.12); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); }
  .pill { height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: transparent; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; cursor: pointer; }
  .pill.danger { border-color: rgba(227,36,43,.6); color: #ff9a9e; }
  .pill.solid { border: 0; background: var(--ice); color: var(--bg); font-weight: 700; }
  .big-cta { height: 64px; padding: 0 40px; border-radius: 999px; border: 0; background: var(--red); color: #fff; display: inline-flex; align-items: center; gap: 12px; font-family: var(--cond); font-weight: 900; font-style: italic; font-size: 30px; text-transform: uppercase; cursor: pointer; }
  .big-cta:disabled { opacity: .4; cursor: not-allowed; }
  .topbar { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .topbar h1 { margin: 0; font-family: var(--cond); font-weight: 900; font-style: italic; font-size: clamp(36px, 5vw, 52px); text-transform: uppercase; }
  .spacer { flex: 1; }

  /* ---------- Etusivu ---------- */
  .home h1.hero { margin: 0; font-family: var(--cond); font-weight: 900; font-style: italic; font-size: clamp(54px, 8vw, 88px); line-height: .95; text-transform: uppercase; }
  .home h1.hero span { color: var(--ice); }
  .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin: 36px 0 24px; }
  .home-card { min-height: 240px; border-radius: 24px; border: 0; cursor: pointer; text-align: left; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; transition: transform .15s; }
  .home-card:hover { transform: translateY(-3px); }
  .home-card .t { font-family: var(--cond); font-weight: 900; font-style: italic; font-size: clamp(42px, 5vw, 56px); line-height: 1; text-transform: uppercase; display: block; }
  .home-card .s { font-size: 17px; display: block; margin-top: 6px; }
  .home-card.play { color: #fff; background: linear-gradient(135deg, transparent 0 60%, rgba(255,255,255,.12) 60% 68%, transparent 68%), linear-gradient(160deg, #e3242b, #9e1218); box-shadow: 0 16px 40px rgba(227,36,43,.25); }
  .home-card.songs { color: var(--text); background: var(--panel); border: 1px solid rgba(255,255,255,.12); }
  .resume { display: flex; align-items: center; gap: 20px 24px; flex-wrap: wrap; padding: 20px 24px; border-radius: 20px; background: var(--panel); border: 1px solid rgba(207,232,255,.25); }
  .resume .score { flex: 1; display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; font-family: var(--cond); font-weight: 800; font-size: 32px; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; }

  /* ---------- Asetukset ---------- */
  .set-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 24px; }
  .set-card { padding: 20px 24px; border-radius: 20px; background: var(--panel); }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .set-row:last-child { border-bottom: 0; }
  .set-row .n { font-size: 17px; font-weight: 600; }
  .set-row .d { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .set-row.disabled { opacity: .4; pointer-events: none; }
  .stepper { display: flex; align-items: center; gap: 4px; flex: none; }
  .stepper button { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--panel2); font-size: 22px; cursor: pointer; }
  .stepper .v { min-width: 96px; text-align: center; font-family: var(--cond); font-weight: 800; font-size: 28px; }
  .seg { display: flex; padding: 4px; border-radius: 14px; background: var(--bg); flex: none; }
  .seg button { height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 15px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ice); color: var(--bg); font-weight: 700; }
  .switch { width: 60px; height: 34px; flex: none; border-radius: 999px; border: 0; padding: 3px; display: flex; cursor: pointer; background: var(--panel2); justify-content: flex-start; }
  .switch[aria-checked="true"] { background: var(--ice); justify-content: flex-end; }
  .switch span { width: 28px; height: 28px; border-radius: 999px; background: var(--bg); }
  .switch[aria-checked="false"] span { background: var(--muted); }
  .fast-note { font-size: 13px; color: var(--ice); margin-top: 4px; }

  /* ---------- Maalilaulut-ruudukko ---------- */
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); padding-bottom: 170px; }
  .team {
    --c1: #333; --c2: #fff; position: relative; aspect-ratio: 1 / 1; border: 0; border-radius: 18px; cursor: pointer; overflow: hidden; color: var(--c2);
    background: linear-gradient(135deg, transparent 0 58%, color-mix(in srgb, var(--c2) 22%, transparent) 58% 66%, transparent 66%),
                linear-gradient(160deg, color-mix(in srgb, var(--c1) 100%, white 8%) 0%, var(--c1) 55%, color-mix(in srgb, var(--c1) 70%, black) 100%);
    box-shadow: 0 6px 20px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08);
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .team:hover { transform: translateY(-3px) scale(1.02); }
  .team .abbr { font-family: var(--cond); font-size: clamp(30px, 4vw, 46px); font-weight: 900; font-style: italic; line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .team .name { font-size: 13px; font-weight: 600; opacity: .85; text-align: center; padding: 0 8px; }
  .team img.logo { width: 62%; height: 62%; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
  .team.has-logo .abbr { display: none; }
  .team.playing { animation: pulse .9s ease-in-out infinite; box-shadow: 0 0 0 3px var(--c2), 0 0 40px 6px var(--c1); }
  .team.playing::after { content: "MAALI!"; position: absolute; top: 10px; right: -34px; transform: rotate(35deg); background: var(--red); color: #fff; font-weight: 900; font-size: 11px; letter-spacing: .1em; padding: 4px 40px; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .songbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(20,25,36,.96); backdrop-filter: blur(8px); border-top: 1px solid rgba(255,255,255,.08); padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  .yt-slot { width: 213px; height: 120px; border-radius: 10px; flex: none; background: #000; }
  .songbar .info { flex: 1; min-width: 0; }
  .songbar .title { font-size: 20px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-err { color: #ffb4b4; font-size: 13px; margin-top: 4px; }
  .song-err a { color: var(--ice); }
  .stop-btn { flex: none; border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer; background: var(--red); color: #fff; font-weight: 800; font-size: 15px; }

  /* ---------- Joukkuevalinta ---------- */
  .slots { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center; margin-bottom: 24px; }
  .slot { min-height: 112px; border-radius: 22px; cursor: pointer; padding: 16px 24px; display: flex; align-items: center; gap: 18px; text-align: left; background: var(--panel); border: 2px solid transparent; }
  .slot.active { border: 2px dashed var(--ice); box-shadow: 0 0 0 6px rgba(207,232,255,.12); }
  .slot .q { width: 64px; height: 64px; flex: none; border-radius: 16px; background: var(--panel2); display: flex; align-items: center; justify-content: center; color: var(--ice); font-size: 34px; }
  .slot .ab { font-family: var(--cond); font-weight: 900; font-style: italic; font-size: 56px; line-height: 1; }
  .slot .nm { font-size: 24px; font-weight: 700; }
  .vs { font-family: var(--cond); font-weight: 900; font-style: italic; font-size: 40px; color: var(--muted); }
  .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
  .pick-grid .team { aspect-ratio: auto; height: 104px; }
  .pick-grid .team .abbr { font-size: 34px; }
  .pick-grid .team.taken { opacity: .28; }
  .pick-foot { display: flex; align-items: center; gap: 16px; margin-top: 28px; flex-wrap: wrap; }
  .pick-foot a { color: var(--ice); font-weight: 600; cursor: pointer; }

  /* ---------- Pelinäkymä ---------- */
  .game-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .periods { display: flex; gap: 8px; }
  .periods span { height: 10px; width: 48px; border-radius: 999px; background: #2a3346; }
  .periods span.done { background: var(--ice); }
  .periods span.cur { background: var(--ice); box-shadow: 0 0 12px var(--ice); }
  .periods span.ot { width: 24px; }
  .board { display: grid; grid-template-columns: 1fr minmax(300px, 380px) 1fr; grid-template-areas: "home clock away"; gap: 20px; }
  .tp { border-radius: 24px; background: var(--panel); overflow: hidden; display: flex; flex-direction: column; }
  .tp.home { grid-area: home; } .tp.away { grid-area: away; }
  .tp .stripe { height: 10px; }
  .tp .in { padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
  .tp .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tp.away .head { flex-direction: row-reverse; }
  .tp .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .tp.away .who { flex-direction: row-reverse; text-align: right; }
  .badge { width: 52px; height: 52px; flex: none; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: var(--cond); font-weight: 900; font-style: italic; font-size: 22px; overflow: hidden; }
  .badge img { width: 80%; height: 80%; object-fit: contain; }
  .tp .tname { font-size: 24px; font-weight: 700; }
  .tp .score { font-family: var(--cond); font-weight: 800; font-size: clamp(80px, 9vw, 120px); line-height: .85; font-variant-numeric: tabular-nums; }
  .goal-btn { height: 84px; border-radius: 18px; border: 0; cursor: pointer; font-family: var(--cond); font-weight: 900; font-style: italic; font-size: 40px; text-transform: uppercase; transition: transform .1s; }
  .goal-btn:active { transform: scale(.97); }
  .acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .acts button { height: 56px; border-radius: 14px; border: 0; background: var(--panel2); font-weight: 700; font-size: 16px; cursor: pointer; }
  .acts .to { border: 1px solid var(--ice); background: transparent; color: var(--ice); }
  .acts .to:disabled { border: 1px dashed rgba(255,255,255,.2); color: var(--muted); font-weight: 600; font-size: 14px; cursor: default; }
  .pens { display: flex; flex-direction: column; gap: 8px; }
  .pen { height: 52px; border-radius: 14px; background: rgba(255,138,0,.12); border: 1px solid rgba(255,138,0,.45); display: flex; align-items: center; gap: 12px; padding: 0 6px 0 16px; }
  .pen .l { font-weight: 700; color: #ffb366; }
  .pen .bar { flex: 1; height: 6px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
  .pen .bar i { display: block; height: 100%; background: var(--orange); }
  .pen .tm { font-family: var(--cond); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
  .pen button { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 22px; }
  .pen-empty { height: 52px; border-radius: 14px; border: 1px dashed rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }
  .center { grid-area: clock; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 6px; }
  .clockbox { width: 100%; border-radius: 24px; background: #05070b; border: 1px solid rgba(207,232,255,.2); padding: 18px 0 12px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 0 60px rgba(207,232,255,.08) inset; }
  .clock { font-family: var(--cond); font-weight: 800; font-size: clamp(96px, 11vw, 136px); line-height: .9; color: #fff; font-variant-numeric: tabular-nums; }
  .clock-status { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .12em; }
  .clock-status .dot { width: 8px; height: 8px; border-radius: 999px; background: currentColor; }
  .play-btn { width: 112px; height: 112px; border-radius: 999px; border: 0; background: var(--ice); color: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(207,232,255,.25); }
  .play-btn.paused { background: var(--green); }
  .play-btn.counting { background: var(--ice); animation: pulse 1s ease-in-out infinite; }
  .manpower { height: 40px; padding: 0 18px; border-radius: 999px; background: rgba(255,138,0,.14); color: #ffb366; display: flex; align-items: center; font-weight: 700; font-size: 15px; text-align: center; }
  .fast-chip { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--ice); background: rgba(207,232,255,.1); padding: 6px 12px; border-radius: 999px; }
  .events { display: flex; align-items: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .ev { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--panel); display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
  .ev.goal { font-weight: 700; }
  .ev .sw { width: 10px; height: 10px; border-radius: 3px; }
  .link-btn { height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: var(--ice); font-weight: 600; font-size: 14px; cursor: pointer; }

  /* ---------- Erätauko / loppu ---------- */
  .break { border-radius: 28px; background: radial-gradient(600px 360px at 50% 20%, #1d2a44 0%, var(--panel) 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 48px 24px; text-align: center; min-height: 560px; }
  .break .big { font-family: var(--cond); font-weight: 800; font-size: clamp(100px, 13vw, 150px); line-height: .9; color: var(--ice); font-variant-numeric: tabular-nums; }
  .break .ttl { font-family: var(--cond); font-weight: 900; font-style: italic; font-size: clamp(52px, 7vw, 72px); line-height: 1; text-transform: uppercase; }
  .sline { display: flex; align-items: center; gap: 20px; justify-content: center; flex-wrap: wrap; font-family: var(--cond); font-weight: 800; font-size: 34px; }
  .sline .n { font-size: 56px; }

  /* ---------- Overlayt ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }
  .goal-ov { flex-direction: column; gap: 18px; padding: 40px 24px; overflow: auto; text-align: center; animation: goalIn .35s ease-out; }
  @keyframes goalIn { from { transform: scale(1.08); opacity: 0; } }
  .goal-ov .word { font-family: var(--cond); font-weight: 900; font-style: italic; font-size: clamp(120px, 18vw, 220px); line-height: .85; text-transform: uppercase; text-shadow: 0 8px 0 rgba(0,0,0,.15); animation: shake .5s ease-in-out 2; }
  @keyframes shake { 25% { transform: rotate(-2deg) scale(1.03); } 75% { transform: rotate(2deg) scale(1.03); } }
  .chip-dark { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 18px; border-radius: 999px; background: rgba(17,17,17,.9); font-size: 14px; font-weight: 700; letter-spacing: .12em; }
  .goal-ov .sline .n { padding: 0 28px; border-radius: 20px; background: rgba(17,17,17,.92); font-size: clamp(64px, 8vw, 96px); line-height: 1.05; }
  .np { width: min(720px, 100%); display: flex; align-items: center; gap: 20px; padding: 16px; border-radius: 22px; background: rgba(17,17,17,.92); color: var(--text); text-align: left; }
  .np .yt-slot { width: 160px; height: 90px; }
  .np .prog { height: 6px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 8px; }
  .np .prog i { display: block; height: 100%; width: 0; }
  .goal-actions { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .goal-actions button { height: 56px; padding: 0 28px; border-radius: 999px; font-weight: 800; font-size: 17px; cursor: pointer; }
  .dim { background: rgba(5,7,11,.75); backdrop-filter: blur(4px); padding: 20px; }
  .dialog { width: min(460px, 100%); border-radius: 24px; background: var(--panel); border: 1px solid rgba(255,255,255,.12); padding: 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .dialog h2 { margin: 0; font-family: var(--cond); font-weight: 900; font-style: italic; font-size: 40px; text-transform: uppercase; }
  .dialog p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .dialog .b { height: 56px; border-radius: 16px; border: 0; font-weight: 700; font-size: 16px; cursor: pointer; background: var(--panel2); }
  .dialog .b.red { background: var(--red); color: #fff; }
  .dialog .b.ghost { background: transparent; color: var(--ice); height: 48px; }
  .to-ov { flex-direction: column; gap: 16px; text-align: center; padding: 24px; }
  .to-ov .big { font-family: var(--cond); font-weight: 800; font-size: clamp(120px, 18vw, 200px); line-height: .9; font-variant-numeric: tabular-nums; }

  #ytDock { position: fixed; z-index: 100; border-radius: 10px; overflow: hidden; background: #000; left: -9999px; top: 0; width: 213px; height: 120px; }
  #ytDock iframe { width: 100%; height: 100%; display: block; }

  @media (max-width: 960px) {
    .board { grid-template-columns: 1fr 1fr; grid-template-areas: "clock clock" "home away"; }
    .center { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .clockbox { width: auto; flex: 1 1 320px; }
  }
  @media (max-width: 640px) {
    .board { grid-template-columns: 1fr; grid-template-areas: "clock" "home" "away"; }
    .slots { grid-template-columns: 1fr; } .vs { text-align: center; }
    .set-grid { grid-template-columns: 1fr; }
    .songbar .yt-slot { width: 142px; height: 80px; }
    .np { flex-direction: column; align-items: stretch; } .np .yt-slot { width: 100%; height: auto; aspect-ratio: 16/9; }
  }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div id="overlay"></div>
<div id="ytDock"><div id="player"></div></div>

<script>
/* =====================================================================
   JOUKKUEET
   - songs: lista kappaleita (klikkaus soittaa ensimmäisen).
            youtube = videon ID tai koko linkki, start = aloitussekunti (valinnainen)
   - logo:  jätä tyhjäksi -> väritunnus. Laita kuvan URL tai polku
            (esim. "logos/saipa.png"), niin logo näytetään.
   - c1/c2: pääväri ja korostusväri
   Lähde: youtube.com/@liigagoalhorns
   ===================================================================== */
const TEAMS = [
  { name: "HIFK",          abbr: "HIFK", c1: "#D7141A", c2: "#FFFFFF", logo: "", songs: [{ label: "2026–27", youtube: "HhqPBEjS-es" }] },
  { name: "HPK",           abbr: "HPK",  c1: "#F47920", c2: "#111111", logo: "", songs: [{ label: "2026–27", youtube: "IXjpAUIU8gY" }] },
  { name: "Ilves",         abbr: "ILV",  c1: "#007A3D", c2: "#FFD100", logo: "", songs: [{ label: "Hands Up", youtube: "d9Vo0bj0PmY" }] },
  { name: "Jokerit",       abbr: "JOK",  c1: "#111111", c2: "#E4002B", logo: "", songs: [{ label: "2026–27", youtube: "IdRRKLH99To" }] },
  { name: "Jukurit",       abbr: "JUK",  c1: "#0B3A75", c2: "#F6C700", logo: "", songs: [{ label: "2026–27", youtube: "exrrAnaowk0" }] },

  { name: "KalPa",         abbr: "KAL",  c1: "#1A1A1A", c2: "#F2B705", logo: "", songs: [{ label: "2025–26", youtube: "HZyNy2LeWUc" }] },

/* ---------------- Ajan laskenta ---------------- */
const isOT = g => g.period > S.periods;
const periodLenMs = g => (isOT(g) ? S.otMin : S.periodMin) * 60000;
const speed = () => S.fast ? Math.max(1, S.periodMin / S.fastPeriodMin) : 1;
const curSpeed = () => speed() * (S.fast && G && (G.penalties[0].length || G.penalties[1].length) ? (100 - (S.penSlow || 0)) / 100 : 1);
const periodName = (g, p = g.period) => p > S.periods ? "Jatkoaika" : `${p}. erä`;
function fmt(ms, tenths) {
  ms = Math.max(0, ms);
  if (tenths && ms < 60000) return (Math.floor(ms / 100) / 10).toFixed(1);
  const s = Math.ceil(ms / 1000);
  return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
}
function fmtFloor(ms) { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
function clockText(g) {
  return S.clockDir === "down" ? fmt(periodLenMs(g) - g.clockMs, true) : fmtFloor(g.clockMs);
}
function totalElapsed(g) {
  let ms = 0;
  for (let p = 1; p < g.period; p++) ms += (p > S.periods ? S.otMin : S.periodMin) * 60000;
  return ms + g.clockMs;
}
const skaters = (g, i) => 5 - Math.min(2, g.penalties[i].length);

/* ---------------- Ääni: summeri ---------------- */
let actx = null;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (actx && actx.state === "suspended") actx.resume(); return actx; }
function horn() {
  if (!S.horn) return;
  const c = audio(); if (!c) return;
  const t = c.currentTime, g = c.createGain(), f = c.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 1600;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.22, t + .06);
  g.gain.setValueAtTime(.22, t + 2.4); g.gain.linearRampToValueAtTime(0, t + 2.9);
  [146.8, 185, 220, 293.7].forEach(fr => { const o = c.createOscillator(); o.type = "sawtooth"; o.frequency.value = fr; o.connect(f); o.start(t); o.stop(t + 3); });
  f.connect(g).connect(c.destination);
}

function startBeep() {
  const c = audio(); if (!c) return;
  const t0 = c.currentTime;
  [[0, .14, 660], [.35, .14, 660], [.7, .75, 990]].forEach(([at, len, fr]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = "square"; o.frequency.value = fr;
    g.gain.setValueAtTime(0, t0 + at); g.gain.linearRampToValueAtTime(.18, t0 + at + .01);
    g.gain.setValueAtTime(.18, t0 + at + len - .03); g.gain.linearRampToValueAtTime(0, t0 + at + len);
    o.connect(g).connect(c.destination); o.start(t0 + at); o.stop(t0 + at + len + .02);
  });
}
/* Jatka: viiveen kanssa tai heti */
function requestStart() {
  if (!G || G.phase !== "play") return;
  audio();
  if (S.delayStart && S.delaySec > 0) { ui.countdown = Date.now() + S.delaySec * 1000; G.running = false; saveGame(); if (view === "game") renderGame(); }
  else { startBeep(); setRunning(true); }
}
const autoOn = () => S.delayStart && S.autoCountdown && S.delaySec > 0;
function autoResume() { if (G && G.phase === "play" && !G.pendingEnd) { G.running = false; requestStart(); } }
function cancelCountdown() { ui.countdown = null; if (view === "game") renderGame(); }

let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}

function manpowerText() {

/* ===================================================================== PELILOGIIKKA */

function newGame(home, away) {
  G = { home, away, score: [0, 0], period: 1, clockMs: 0, running: true, phase: "play",
        timeouts: [false, false], penalties: [[], []], events: [], seq: 1, breakEnds: 0, pendingEnd: false, otWin: false, aborted: false };
  G.running = false; audio();
  saveGame(); go("game"); requestStart();
}
function toggleClock() {
  if (G.running) { ui.countdown = null; setRunning(false); }
  else if (ui.countdown) cancelCountdown();
  else requestStart();
}
function setRunning(on) {
  if (!G || G.phase !== "play") return;
  G.running = on; lastTick = performance.now(); saveGame();
  if (view === "game") renderGame();
}
function addGoal(i) {
  audio();
  const wasRunning = G.running;
  const opp = 1 - i;
  G.score[i]++;
  const ev = { type: "goal", team: i, at: totalElapsed(G), s0: G.score[0], s1: G.score[1] };
  // Ylivoimamaali päättää vastustajan lyhimmän 2 min jäähyn
  if (skaters(G, i) > skaters(G, opp)) {
    const minors = G.penalties[opp].filter(p => p.min === 2).sort((a, b) => a.left - b.left);
    if (minors.length) { ev.cleared = { team: opp, pen: { ...minors[0] } }; G.penalties[opp] = G.penalties[opp].filter(p => p.id !== minors[0].id); }
  }
  G.events.push(ev);
  if (S.stopOnGoal || S.stopOnEvent) { G.running = false; ui.countdown = null; }
  else if ((wasRunning || ui.countdown) && autoOn()) { G.running = false; ui.countdown = Date.now() + S.delaySec * 1000; }
  if (isOT(G)) { G.running = false; G.pendingEnd = true; G.otWin = true; }
  saveGame();
  const t = team(i === 0 ? G.home : G.away);
  ui.goal = { abbr: t.abbr, team: i, wasRunning };
  render();
  playSong(t.abbr, 0, "goal");
}
function undoEvent(ev) {
  if (ev.type === "goal") {
    G.score[ev.team] = Math.max(0, G.score[ev.team] - 1);
    if (ev.cleared) G.penalties[ev.cleared.team].push(ev.cleared.pen);
    if (G.pendingEnd) { G.pendingEnd = false; G.otWin = false; }
  } else if (ev.type === "pen") {
    G.penalties[ev.team] = G.penalties[ev.team].filter(p => p.id !== ev.id);
  } else if (ev.type === "to") {
    G.timeouts[ev.team] = false;
  }
}
function addPenalty(i, min) {
  if (S.stopOnEvent) ui.countdown = null;
  const p = { id: G.seq++, min, left: min * 60000 };
  G.penalties[i].push(p);
  G.events.push({ type: "pen", team: i, min, id: p.id, at: totalElapsed(G) });
  const wasRunning = G.running || !!ui.countdown;
  if (S.stopOnEvent) G.running = false;
  saveGame(); renderGame();
  if (!S.stopOnEvent && wasRunning && autoOn()) autoResume();
}
function takeTimeout(i) {
  if (G.timeouts[i]) return;
  G.timeouts[i] = true; G.running = false; ui.countdown = null;
  G.events.push({ type: "to", team: i, at: totalElapsed(G) });
  ui.timeout = { abbr: i === 0 ? G.home : G.away, ends: Date.now() + S.timeoutSec * 1000 };
  saveGame(); render();
}
function endPeriod() {
  ui.countdown = null;
  G.running = false; G.clockMs = periodLenMs(G);
  horn();
  const tied = G.score[0] === G.score[1];
  const last = G.period >= S.periods;
  if (isOT(G) || (last && (!tied || !S.otMin))) return finishGame(false);
  if (S.intermissionMin > 0) { G.phase = "break"; G.breakEnds = Date.now() + S.intermissionMin * 60000; saveGame(); go("break"); }
  else startNextPeriod(false);
}
function startNextPeriod(run = true) {
  G.period++; G.clockMs = 0; G.phase = "play"; G.breakHorn = false; G.running = false; lastTick = performance.now();
  saveGame(); go("game");
  if (run) requestStart();
}
function finishGame(aborted) {
  G.running = false; G.phase = "ended"; G.aborted = aborted;
  store.del("mll.game");
  ui.confirm = false;
  go("final");
}

/* ---------------- Ajastin ---------------- */
let lastTick = performance.now(), lastSave = 0;
function tick(now) {
  const dt = now - lastTick; lastTick = now;
  if (G && G.phase === "play" && G.running) {
    const g = dt * curSpeed();
    G.clockMs += g;
    let penChanged = false;
    for (const i of [0, 1]) {
      for (const p of G.penalties[i]) p.left -= g;
      const before = G.penalties[i].length;
      G.penalties[i] = G.penalties[i].filter(p => p.left > 0);
      if (G.penalties[i].length !== before) penChanged = true;
    }
    if (G.clockMs >= periodLenMs(G)) endPeriod();
    else if (view === "game") {
      if (penChanged) renderGame();
      else {
        const c = $("#clock"); if (c) c.textContent = clockText(G);
        for (const i of [0, 1]) for (const p of G.penalties[i]) {
          const el = document.getElementById("pen-" + p.id);
          if (el) { el.querySelector(".tm").textContent = fmt(p.left); el.querySelector(".bar i").style.width = (100 * p.left / (p.min * 60000)) + "%"; }
        }
      }
    }
    if (now - lastSave > 2000) { lastSave = now; saveGame(); }
  }
  if (G && G.phase === "break" && view === "break") {
    const el = $("#breakClock"); if (el) el.textContent = fmt(G.breakEnds - Date.now());
    if (G.breakEnds - Date.now() <= 0 && !G.breakHorn) { G.breakHorn = true; horn(); if (autoOn()) startNextPeriod(true); }
  }
  if (ui.countdown) {
    const left = ui.countdown - Date.now();
    const n = Math.max(1, Math.ceil(left / 1000));
    document.querySelectorAll("#cdNum,.cdNum").forEach(el => el.textContent = n);
    if (left <= 0) { ui.countdown = null; startBeep(); setRunning(true); if (ui.goal) { renderOverlay(); placeDock(); } }
  }
  if (ui.timeout) {
    const left = ui.timeout.ends - Date.now();
    const el = $("#toClock"); if (el) el.textContent = Math.max(0, Math.ceil(left / 1000));
    if (left <= 0) { ui.timeout = null; horn(); render(); if (autoOn()) autoResume(); }
  }
  if (song) updateSongProgress();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ===================================================================== YOUTUBE */

let player = null, playerReady = false, pending = null, song = null, fadeTimer = null;
function videoId(v) { const m = String(v || "").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : String(v || "").trim(); }

function playSong(abbr, i, ctx) {
  const t = team(abbr), s = t.songs[i];
  clearInterval(fadeTimer);
  song = { abbr, ctx, start: s.start || 0, limit: S.songLimit };
  const opts = { videoId: videoId(s.youtube), startSeconds: s.start || 0 };
  if (playerReady) { player.setVolume(100); player.loadVideoById(opts); } else pending = opts;
  placeDock();
}
function stopSong(fade) {
  if (!song) return;
  clearInterval(fadeTimer);
  const end = () => { if (playerReady) { player.stopVideo(); player.setVolume(100); } song = null; placeDock(); if (view === "songs") renderSongs(); };
  if (fade && playerReady) {
    let v = 100;
    fadeTimer = setInterval(() => { v -= 8; if (v <= 0) { clearInterval(fadeTimer); end(); } else player.setVolume(v); }, 100);
  } else end();
}
function updateSongProgress() {
  if (!playerReady || !song) return;
  let t = 0, d = 0;
  try { t = player.getCurrentTime() - song.start; d = player.getDuration() - song.start; } catch { return; }
  const total = song.limit ? Math.min(song.limit, d || song.limit) : d;
  const el = $("#songProg"); if (el && total > 0) el.style.width = Math.min(100, 100 * t / total) + "%";
  if (song.limit && t >= song.limit && !fadeTimer) { fadeTimer = 1; stopSong(true); }
}
function placeDock() {
  const slot = song && document.querySelector(".yt-slot");
  if (!slot) { dock.style.left = "-9999px"; return; }
  const r = slot.getBoundingClientRect();
  Object.assign(dock.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
}
addEventListener("resize", placeDock);
addEventListener("scroll", placeDock, { passive: true });
overlay.addEventListener("scroll", placeDock, true);

window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player("player", {
    width: "100%", height: "100%",
    playerVars: { autoplay: 1, controls: 1, rel: 0, playsinline: 1 },
    events: {
      onReady: () => { playerReady = true; if (pending) { player.loadVideoById(pending); pending = null; } },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) stopSong(false); },
      onError: e => {
        if (!song) return;
        const id = videoId(team(song.abbr).songs[0].youtube);
        const why = (e.data === 101 || e.data === 150) ? "Video ei salli upotusta." : e.data === 100 ? "Videota ei löydy." : e.data === 153 ? "YouTube estää soiton tästä osoitteesta – avaa sivu GitHub Pagesista." : "Video ei toistu.";
        document.querySelectorAll(".song-err").forEach(el => { el.innerHTML = `${why} <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Avaa YouTubessa</a>`; el.hidden = false; });
      },
    },
  });
};
(() => { const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s); })();

/* ===================================================================== TAPAHTUMAT */

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-step],[data-seg],[data-sw],[data-abbr],[data-slot],[data-goal],[data-pen],[data-to],[data-unpen]");
  if (!b) return;
  const d = b.dataset;

  if (d.step) {
    const r = SET_ROWS.flatMap(g => g.rows).find(r => r.k === d.step);
    S[r.k] = Math.min(r.max, Math.max(r.min, Math.round((S[r.k] + r.step * +d.d) * 10) / 10));
    saveSettings(); return renderSettings();
  }
  if (d.seg) { const v = isNaN(+d.v) ? d.v : +d.v; S[d.seg] = v; saveSettings(); return renderSettings(); }
  if (d.sw) { S[d.sw] = !S[d.sw]; saveSettings(); return renderSettings(); }
  if (d.slot !== undefined) { ui.activeSlot = +d.slot; return renderPick(); }
  if (d.abbr) {
    if (view === "songs") {
      audio();
      if (song && song.ctx === "list" && song.abbr === d.abbr) stopSong();
      else { playSong(d.abbr, 0, "list"); renderSongs(); placeDock(); }
      return;
    }
    if (view === "pick") {
      const other = 1 - ui.activeSlot;
      if (ui.pick[other] === d.abbr) ui.pick[other] = null;
      ui.pick[ui.activeSlot] = d.abbr;
      if (!ui.pick[other]) ui.activeSlot = other;
      return renderPick();
    }
  }
  if (d.goal !== undefined) return addGoal(+d.goal);
  if (d.pen !== undefined) return addPenalty(+d.pen, +d.min);
  if (d.to !== undefined) return takeTimeout(+d.to);
  if (d.unpen !== undefined) { G.penalties[+d.unpen] = G.penalties[+d.unpen].filter(p => p.id !== +d.id); saveGame(); return renderGame(); }

  switch (d.act) {
    case "settings": settingsReturn = view; return go("settings");
    case "back": return go(settingsReturn || "home");
    case "home": return go("home");
    case "songs": return go("songs");
    case "reset": S = Object.assign({}, DEFAULTS); saveSettings(); return renderSettings();
    case "newgame":
      if (G && G.phase !== "ended" && !confirm("Sinulla on kesken jäänyt peli. Aloitetaanko uusi peli sen tilalle?")) return;
      ui.pick = [null, null]; ui.activeSlot = 0; return go("pick");
    case "resume": lastTick = performance.now(); return go(G.phase === "break" ? "break" : "game");
    case "start": return newGame(ui.pick[0], ui.pick[1]);
    case "clock": audio(); return toggleClock();
    case "exit": G.running = false; ui.countdown = null; ui.confirm = false; saveGame(); return go("home");
    case "end": ui.confirm = true; G.running = false; ui.countdown = null; saveGame(); return render();
    case "cancel": ui.confirm = false; return render();
    case "abort": return finishGame(true);
    case "undo": { const ev = G.events.pop(); if (ev) undoEvent(ev); saveGame(); return renderGame(); }
    case "nextperiod": return startNextPeriod(true);
    case "stopsong": return stopSong();
    case "mute": return stopSong(true);
    case "undogoal": {
      const i = G.events.map(e => e.type).lastIndexOf("goal");
      if (i >= 0) undoEvent(G.events.splice(i, 1)[0]);
      ui.goal = null; stopSong(); saveGame(); return render();
    }
    case "goalok":
      { const wasRunning = ui.goal && ui.goal.wasRunning;
      ui.goal = null; stopSong(true);
      if (G.pendingEnd) return finishGame(false);
      lastTick = performance.now(); saveGame(); render();
      if (S.stopOnGoal && !S.stopOnEvent && wasRunning) requestStart();
      return; }
    case "endtimeout": ui.timeout = null; render(); if (autoOn()) autoResume(); return;
  }
});
let settingsReturn = "home";

document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea")) return;
  if (e.code === "Space") {
    if (ui.goal || ui.timeout || ui.confirm) return;
    if (view === "game") { e.preventDefault(); toggleClock(); }
    else if (view === "songs" && song) { e.preventDefault(); stopSong(); }
  }
  if (e.key === "Escape") {
    if (ui.confirm) { ui.confirm = false; render(); }
    else if (view === "songs" && song) stopSong();
  }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) { lastTick = performance.now(); if (view === "game" || view === "break") keepAwake(true); } });

render();
</script>
</body>
